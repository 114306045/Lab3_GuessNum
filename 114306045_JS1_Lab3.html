<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>114306045_Number Guessing Game</title>
</head>
<body>

<h1>114306045_Number Guessing Game</h1>

<div id="image"></div>

<script>
    let answer = Math.floor(Math.random() * 100) + 1;
    let chances = 7;
    let min = 1;
    let max = 100;

    while (chances > 0) {
        let input = window.prompt(
            `Enter a number between ${min} and ${max}\nRemaining attempts: ${chances}`
        );

        if (input === null) {
            alert("Game cancelled.");
            break;
        }

        input = input.trim();

        if (input === "" || isNaN(input)) {
            alert("Invalid input! Please enter a number.");
            continue;
        }

        let guess = Number(input);

        if (guess < min || guess > max) {
            alert(`Input must be between ${min} and ${max}.`);
            continue;
        }

        chances--;

        if (guess === answer) {
            alert("Correct! You win!");
            document.getElementById("image").innerHTML =
                '<img src="images/correct.jpg" alt="correct">';
            break;
        } else if (guess < answer) {
            min = guess + 1;
            alert("Too small!");
        } else {
            max = guess - 1;
            alert("Too big!");
        }

        if (chances === 0) {
            alert(`Game over! The correct answer was: ${answer}`);
            document.getElementById("image").innerHTML =
                '<img src="images/wrong.jpg" alt="wrong">';
        }
    }
</script>

</body>
</html>
